<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#06132f"> <title>Student AI Coding Tutor</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } :root { --blue: #1688ff; --cyan: #36d9ff; --purple: #854bff; --bg: #020b20; --white: #f7faff; } body { min-height: 100vh; font-family: "Noto Sans Bengali", Arial, sans-serif; background: radial-gradient(ellipse at 50% 40%, #102d68 0%, #06132f 48%, #020817 100%); color: var(--white); overflow-x: hidden; } .app { min-height: 100vh; width: 100%; max-width: 480px; margin: auto; padding: 28px 22px 24px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; } /* Background glow */ .glow { position: absolute; width: 270px; height: 270px; border-radius: 50%; background: #245dff; filter: blur(110px); opacity: 0.20; top: 25%; left: 50%; transform: translateX(-50%); pointer-events: none; } .glow-bottom { position: absolute; width: 230px; height: 180px; background: #8c38ff; filter: blur(100px); opacity: 0.18; bottom: 8%; right: -100px; pointer-events: none; } /* Logo */ .logo { width: 100px; height: 100px; border-radius: 27px; display: flex; justify-content: center; align-items: center; flex-direction: column; background: linear-gradient(145deg, #078dff, #1646ed 60%, #8d48ff); border: 2px solid #68caff; box-shadow: 0 0 22px #167aff65, inset 0 0 18px #ffffff20; z-index: 1; } .cap { font-size: 39px; line-height: 1.1; } .code-symbol { font-size: 29px; font-weight: 900; letter-spacing: -2px; } h1 { text-align: center; font-size: clamp(27px, 7vw, 36px); line-height: 1.18; margin-top: 23px; font-weight: 800; letter-spacing: -0.7px; } h1 span { background: linear-gradient(90deg, #39c8ff, #8b65ff); -webkit-background-clip: text; background-clip: text; color: transparent; } .tagline { margin-top: 14px; font-size: 15px; text-align: center; color: #a9dfff; line-height: 1.9; } .features { margin-top: 17px; display: flex; justify-content: center; gap: 13px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: #45c9ff; } .features b { color: #8e6bff; } /* Robot illustration area */ .robot-area { width: 100%; height: 300px; margin-top: 25px; position: relative; display: flex; justify-content: center; align-items: center; } .orbit { position: absolute; width: 245px; height: 245px; border: 1px solid #298fff40; border-radius: 50%; box-shadow: 0 0 35px #186bff19, inset 0 0 35px #186bff15; } .orbit::before, .orbit::after { content: ""; position: absolute; border: 1px solid #6a55ff50; border-radius: 50%; inset: 20px; } .orbit::after { inset: 40px; border-color: #36d9ff30; } .robot { width: 155px; height: 190px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; animation: float 3s ease-in-out infinite; } .robot-head { width: 118px; height: 100px; border-radius: 35px 35px 29px 29px; background: linear-gradient(145deg, #ffffff, #b9e9ff); border: 3px solid #58caff; box-shadow: 0 0 24px #27aaff90, inset 0 -10px 18px #6ba8ff45; position: relative; display: flex; justify-content: center; align-items: center; } .robot-head::before { content: ""; position: absolute; width: 12px; height: 24px; top: -25px; left: 50%; transform: translateX(-50%); background: #45c9ff; border-radius: 8px; } .robot-head::after { content: ""; position: absolute; width: 17px; height: 17px; top: -32px; left: calc(50% - 8px); background: #a56aff; border-radius: 50%; box-shadow: 0 0 15px #a56aff; } .robot-face { width: 86px; height: 57px; border-radius: 18px; background: linear-gradient(135deg, #061936, #102e5c); display: flex; align-items: center; justify-content: center; gap: 18px; box-shadow: inset 0 0 12px #167aff65; } .eye { width: 12px; height: 18px; border-radius: 50%; background: #42d9ff; box-shadow: 0 0 12px #42d9ff; animation: blink 4s infinite; } .robot-body { width: 92px; height: 65px; margin-top: -3px; background: linear-gradient(145deg, #e6f7ff, #8bc9ff); border: 3px solid #56baff; border-radius: 22px 22px 30px 30px; position: relative; box-shadow: 0 0 20px #148bff55; } .robot-body::before, .robot-body::after { content: ""; position: absolute; width: 25px; height: 45px; top: 5px; border-radius: 15px; background: linear-gradient(#d5f1ff, #6eaaff); } .robot-body::before { left: -22px; transform: rotate(20deg); } .robot-body::after { right: -22px; transform: rotate(-20deg); } .robot-core { width: 32px; height: 32px; background: linear-gradient(135deg, #167aff, #914dff); border: 2px solid white; border-radius: 11px; position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: bold; } .side-code { position: absolute; top: 80px; width: 72px; height: 70px; border: 1px solid #258fff80; border-radius: 13px; background: #09234b99; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px; color: #50caff; font-family: monospace; font-size: 10px; box-shadow: 0 0 20px #0e6bff20; } .side-code.left { left: 0; transform: rotate(-8deg); } .side-code.right { right: 0; transform: rotate(8deg); color: #bd91ff; } .code-line { height: 3px; width: 100%; background: currentColor; border-radius: 4px; opacity: 0.8; } .code-line.short { width: 55%; } .plant { position: absolute; bottom: 28px; font-size: 37px; filter: drop-shadow(0 0 12px #23ffac40); } .plant.left { left: 8px; } .plant.right { right: 8px; } /* Button */ .start-button { width: 100%; max-width: 360px; min-height: 56px; border: 1px solid #61baff; border-radius: 18px; background: linear-gradient(100deg, #087bff, #315fff 55%, #7748ff); color: white; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 30px #126dff45; transition: transform 0.2s, box-shadow 0.2s; position: relative; z-index: 2; } .start-button:active { transform: scale(0.97); } .start-button:hover { box-shadow: 0 8px 35px #347cff85; } .button-arrow { margin-left: 7px; font-size: 19px; } .login-text { margin-top: 21px; font-size: 13px; color: #a6b8d8; position: relative; z-index: 2; } .login-text a { color: #50caff; text-decoration: none; font-weight: bold; margin-left: 4px; } .dots { display: flex; gap: 7px; margin-top: 24px; } .dots span { width: 7px; height: 7px; background: #35547c; border-radius: 50%; } .dots span:first-child { width: 22px; border-radius: 8px; background: linear-gradient(90deg, #29c7ff, #785bff); } /* Animations */ @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } } @keyframes blink { 0%, 45%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(0.15); } } /* Small screen adjustment */ @media (max-width: 360px) { .app { padding: 24px 16px; } .logo { width: 86px; height: 86px; } .robot-area { height: 265px; } .orbit { width: 215px; height: 215px; } .side-code { width: 58px; } .plant { font-size: 29px; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } } </style> </head> <body> <main class="app"> <div class="glow"></div> <div class="glow-bottom"></div> <div class="logo"> <div class="cap">🎓</div> <div class="code-symbol">&lt;/&gt;</div> </div> <h1> Student AI<br> <span>Coding Tutor</span> </h1> <p class="tagline"> কোডিং শিখুন, নিজের ভবিষ্যৎ গড়ুন<br> আপনার শেখার সঙ্গী, সবসময় পাশে! </p> <div class="features"> <span>Learn</span> <b>•</b> <span>Practice</span> <b>•</b> <span>Build</span> </div> <section class="robot-area"> <div class="orbit"></div> <div class="side-code left"> <span class="code-line"></span> <span class="code-line short"></span> <span class="code-line"></span> <span class="code-line short"></span> </div> <div class="side-code right"> <span class="code-line short"></span> <span class="code-line"></span> <span class="code-line short"></span> <span class="code-line"></span> </div> <div class="robot"> <div class="robot-head"> <div class="robot-face"> <span class="eye"></span> <span class="eye"></span> </div> </div> <div class="robot-body"> <div class="robot-core">&lt;/&gt;</div> </div> </div> <div class="plant left">🌱</div> <div class="plant right">🪴</div> </section> <button class="start-button" id="startBtn"> Get Started <span class="button-arrow">→</span> </button> <p class="login-text"> ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">Login</a> </p> <div class="dots"> <span></span> <span></span> <span></span> </div> </main> <script> document.getElementById("startBtn").addEventListener("click", function () { window.location.href = "login.html"; }); </script> </body> </html>
